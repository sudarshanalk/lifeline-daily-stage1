<body>
<header class="hero"><h1 id="toolTitle"></h1><p class="tagline" id="toolTagline"></p></header>
<main class="wrap">
  <p class="scope" id="scopeStatement" data-test="scope"></p>
  <div class="lld-gate" id="lldGate" role="status" aria-live="polite" aria-busy="true" data-test="status-gate"></div>
  <div class="lld-unavailable hidden" id="lldUnavailable" hidden data-test="unavailable"></div>

  <form id="tool" class="hidden" hidden novalidate>
    <div class="summary" id="errSummary" tabindex="-1" role="alert" hidden data-test="error-summary"></div>

    <section class="card" aria-labelledby="secAbout">
      <h2 id="secAbout"></h2>
      <div class="field">
        <label for="age" id="qAge"></label>
        <input type="number" id="age" inputmode="numeric" min="1" max="120" step="1" aria-describedby="err-age" autocomplete="off">
        <div class="err" id="err-age" data-err="age" hidden></div>
      </div>
      <div class="field" role="group" aria-labelledby="qPreg">
        <span class="q" id="qPreg"></span>
        <div class="taps" data-tap="preg" id="pregTaps"></div>
        <div class="err" id="err-preg" data-err="preg" hidden></div>
      </div>
      <div class="field" role="group" aria-labelledby="qEat">
        <span class="q" id="qEat"></span>
        <div class="taps" data-tap="eat" id="eatTaps"></div>
        <div class="err" id="err-eat" data-err="eat" hidden></div>
      </div>
    </section>

    <section class="card" aria-labelledby="secMeasure">
      <h2 id="secMeasure"></h2>
      <div class="toggle-row"><span class="lbl" id="unitsLbl"></span>
        <button type="button" class="tap" id="allMetric" aria-pressed="true"></button>
        <button type="button" class="tap" id="allImperial" aria-pressed="false"></button>
      </div>
      <div class="field">
        <label for="ht" id="qHt"></label>
        <div class="measure"><div id="htInputs"></div>
          <select class="unit-sel" id="htUnit" aria-label="Height unit"><option value="cm">cm</option><option value="ftin">ft + in</option></select></div>
        <div class="err" id="err-ht" data-err="ht" hidden></div>
      </div>
      <div class="field">
        <label for="wt" id="qWt"></label>
        <div class="measure"><div id="wtInputs"></div>
          <select class="unit-sel" id="wtUnit" aria-label="Weight unit"><option value="kg">kg</option><option value="stlb">st + lb</option><option value="lb">lb</option></select></div>
        <div class="err" id="err-wt" data-err="wt" hidden></div>
      </div>
      <div class="field">
        <label for="waist" id="qWaist"></label>
        <div class="measure"><div id="waistInputs"></div>
          <select class="unit-sel" id="waistUnit" aria-label="Waist unit"><option value="cm">cm</option><option value="in">inches</option></select></div>
        <details class="how" data-test="waist-how"><summary id="howWaistTitle"></summary><p id="howWaistBody"></p></details>
        <div class="err" id="err-waist" data-err="waist" hidden></div>
      </div>
    </section>

    <section class="card" aria-labelledby="secBackground">
      <h2 id="secBackground"></h2>
      <div class="field" role="group" aria-labelledby="qBg">
        <span class="q" id="qBg"></span>
        <div class="taps" data-tap="bg" id="bgTaps"></div>
        <div class="err" id="err-bg" data-err="bg" hidden></div>
      </div>
      <div class="field" role="group" aria-labelledby="qMixed" id="mixedField" hidden>
        <span class="q" id="qMixed"></span>
        <div class="taps" data-tap="mixed" id="mixedTaps"></div>
        <div class="err" id="err-mixed" data-err="mixed" hidden></div>
      </div>
      <div class="field" role="group" aria-labelledby="qLoss">
        <span class="q" id="qLoss"></span>
        <div class="taps" data-tap="loss" id="lossTaps"></div>
        <div class="err" id="err-loss" data-err="loss" hidden></div>
      </div>
    </section>

    <button type="submit" class="cta" id="submitBtn"></button>
  </form>

  <section id="results" hidden aria-live="polite" tabindex="-1" data-test="results">
    <div id="bannerZone" data-test="banners"></div>
    <div class="panel headline" id="headlineZone" data-test="headline"></div>
    <div class="panel" id="rangeZone" data-test="range"></div>
    <div class="panel" id="waistZone" data-test="waist"></div>
    <div class="panel" id="meaningZone" data-test="meaning"></div>
    <details class="method" data-test="methodology"><summary id="methodTitle"></summary><div class="body" id="methodBody"></div></details>
  </section>
  <footer class="disc" id="discZone" data-test="disclaimer"></footer>
</main>

  disclaimerLinks: "This is not a diagnosis. Read our <a href=\"__LLD_ORIGIN__/medical-disclaimer/\" target=\"_top\">medical disclaimer</a> and our <a href=\"__LLD_ORIGIN__/privacy-policy/\" target=\"_top\">privacy policy</a>.",
  urgentCare: "If you feel very unwell, contact your local emergency number or get a same-day medical assessment. <a href=\"__LLD_ORIGIN__/medical-disclaimer/#urgent-care\" target=\"_top\">When to seek urgent care</a>."
};

/* ============================================================================
 * (2) HW_ENGINE — FROZEN (engine-freeze, manifests/healthy-weight.json).
 * Calculation, thresholds, rounding (D55) and the safety order (D52). Pure: no DOM.
 * ==========================================================================*/
var HW_ENGINE = (function(){
  var ADJUSTED = ['Indian','Pakistani','Bangladeshi','OtherSouthAsian','Chinese','OtherAsian','MiddleEastern','BlackAfrican','BlackCaribbean'];
  var CUTS = { standard:[18.5,25,30,35,40], adjusted:[18.5,23,27.5,32.5,37.5] };
  var NAMES = ['underweight','healthy','overweight','obese1','obese2','obese3'];
  var EPS = 1e-9;
  function roundHalfUp(x, dp){ var f = Math.pow(10, dp); return Math.floor(x * f + 0.5 + EPS) / f; }
  function adjusted(bg, mixed){ return ADJUSTED.indexOf(bg) >= 0 || (bg === 'Mixed' && mixed === 'yes'); }
  function bmiOf(weightKg, heightCm){ return weightKg * 10000 / (heightCm * heightCm); }
  function category(bmi1, adj){ var c = CUTS[adj ? 'adjusted' : 'standard'], i = 0; while (i < c.length && bmi1 >= c[i]) i++; return NAMES[i]; }
  function waistBand(ratio2, bmi1){
    if (bmi1 >= 35) return 'notShown';
    if (ratio2 < 0.40) return 'below';
    if (ratio2 < 0.50) return 'healthy';
    if (ratio2 < 0.60) return 'increased';
    return 'high';
  }
  /* every weight whose BMI, as shown, is healthy: from BMI 18.45 up to (not including) 24.95, or 22.95 adjusted;
     ends rounded inwards to 0.1 kg or whole pounds, so each end is itself classed healthy */
  function range(heightCm, adj){
    var m2 = Math.pow(heightCm / 100, 2), lo = 18.45 * m2, hi = (adj ? 22.95 : 24.95) * m2, LB = 0.45359237;
    return { lowKg: Math.ceil(lo * 10 - EPS) / 10, highKg: (Math.ceil(hi * 10 - EPS) - 1) / 10,
             lowLb: Math.ceil(lo / LB - EPS), highLb: Math.ceil(hi / LB - EPS) - 1 };
  }
  /* i: { age, preg, eat, heightCm, weightKg, waistCm|null, bg, mixed, loss } — already validated except the stops */
  function assess(i){
    if (i.age < 18) return { stop: 'under18' };                                    /* stops first (D52), no numbers */
    if (i.preg === 'yes' || i.preg === 'notsure') return { stop: 'pregnancy' };
    if (i.eat === 'yes') return { stop: 'eating' };
    var adj = adjusted(i.bg, i.mixed);
    var bmi1 = roundHalfUp(bmiOf(i.weightKg, i.heightCm), 1);
    var cat = category(bmi1, adj);
    var out = { stop: null, bmi: bmi1, category: cat, adjusted: adj, range: range(i.heightCm, adj),
                waist: null, weightLoss: i.loss === 'yes', notes: [] };
    if (i.waistCm != null) { var r2 = roundHalfUp(i.waistCm / i.heightCm, 2); out.waist = { ratio: r2, band: waistBand(r2, bmi1) }; }
    if (cat === 'underweight') out.notes.push('underweight');
    if (cat === 'obese3') out.notes.push('class3');
    if (i.age >= 65) out.notes.push('older');
    out.onward = !out.weightLoss && cat !== 'underweight';                          /* FR2-39: no track offer after these */
    return out;
  }
  return { assess: assess, roundHalfUp: roundHalfUp, bmiOf: bmiOf, category: category, waistBand: waistBand, range: range, adjusted: adjusted };
})();

/* ============================================================================
 * (3) STATE + UI
 * ==========================================================================*/
var IN_CM = 2.54, FT_CM = 30.48, LB_KG = 0.45359237, ST_KG = 6.35029318;
var S = { preg: null, eat: null, bg: null, mixed: null, loss: null };
var LAST = null;
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

function fillCopy(){
  var M = MESSAGES, Q = M.q;
  $('#toolTitle').textContent = M.title; $('#toolTagline').textContent = M.tagline; $('#scopeStatement').textContent = M.scope;
  $('#secAbout').textContent = M.sections.about; $('#secMeasure').textContent = M.sections.measure; $('#secBackground').textContent = M.sections.background;
  $('#qAge').textContent = Q.age; $('#qPreg').textContent = Q.preg;
  $('#qEat').innerHTML = esc(Q.eat) + '<span class="sub">' + esc(Q.eatWhy) + '</span>';
  $('#qHt').textContent = Q.height; $('#qWt').textContent = Q.weight;
  $('#qWaist').innerHTML = esc(Q.waist) + '<span class="sub">' + esc(Q.waistWhy) + '</span>';
  $('#qBg').innerHTML = esc(Q.bg) + '<span class="sub">' + esc(Q.bgWhy) + '</span>';
  $('#qMixed').textContent = Q.mixed; $('#qLoss').textContent = Q.loss;
  $('#unitsLbl').textContent = Q.units; $('#allMetric').textContent = Q.metric; $('#allImperial').textContent = Q.imperial;
  $('#submitBtn').textContent = Q.submit;
  $('#howWaistTitle').textContent = M.howWaist.title; $('#howWaistBody').textContent = M.howWaist.body;
  $('#methodTitle').textContent = M.method.title;
  ['preg','eat','bg','mixed','loss'].forEach(function(k){
    $('#' + k + 'Taps').innerHTML = M.options[k].map(function(o){ return '<button type="button" class="tap" aria-pressed="false" data-val="' + o[0] + '">' + esc(o[1]) + '</button>'; }).join('');
  });
  $('#discZone').innerHTML = '<p>' + esc(M.disclaimer) + '</p><p class="lld-disclaimer-links">' + M.disclaimerLinks + '</p><p class="lld-urgent" data-test="urgent-care">' + M.urgentCare + '</p>';
}

function lengthInputs(id, unit, label){
  if (unit === 'ftin') return '<div class="split"><input type="number" id="' + id + '_a" inputmode="numeric" placeholder="ft" aria-label="' + label + ', feet"><input type="number" id="' + id + '_b" inputmode="decimal" placeholder="in" aria-label="' + label + ', inches"></div>';
  return '<input type="number" id="' + id + '" inputmode="decimal" placeholder="' + (unit === 'in' ? 'e.g. 34' : (id === 'ht' ? 'e.g. 170' : 'e.g. 85')) + '" aria-describedby="err-' + id + '">';
}
function massInputs(id, unit){
  if (unit === 'stlb') return '<div class="split"><input type="number" id="' + id + '_a" inputmode="numeric" placeholder="st" aria-label="Weight, stones"><input type="number" id="' + id + '_b" inputmode="decimal" placeholder="lb" aria-label="Weight, pounds"></div>';
  return '<input type="number" id="' + id + '" inputmode="decimal" placeholder="' + (unit === 'lb' ? 'e.g. 165' : 'e.g. 70') + '" aria-describedby="err-' + id + '">';
}
function num(sel){ var el = $(sel); if (!el || el.value.trim() === '') return null; var v = Number(el.value); return isFinite(v) ? v : NaN; }
function readLen(id, unit){
  if (unit === 'ftin') { var a = num('#' + id + '_a'), b = num('#' + id + '_b'); if (a === null && b === null) return null; if (isNaN(a) || isNaN(b)) return NaN; return (a || 0) * FT_CM + (b || 0) * IN_CM; }
  var v = num('#' + id); if (v === null || isNaN(v)) return v; return unit === 'in' ? v * IN_CM : v;
}
function readKg(id, unit){
  if (unit === 'stlb') { var a = num('#' + id + '_a'), b = num('#' + id + '_b'); if (a === null && b === null) return null; if (isNaN(a) || isNaN(b)) return NaN; return (a || 0) * ST_KG + (b || 0) * LB_KG; }
  var v = num('#' + id); if (v === null || isNaN(v)) return v; return unit === 'lb' ? v * LB_KG : v;
}
function renderMeasures(){
  var keep = { ht: readLen('ht', $('#htUnit').dataset.prev || 'cm'), wt: readKg('wt', $('#wtUnit').dataset.prev || 'kg'), waist: readLen('waist', $('#waistUnit').dataset.prev || 'cm') };
  $('#htInputs').innerHTML = lengthInputs('ht', $('#htUnit').value, 'Height');
  $('#wtInputs').innerHTML = massInputs('wt', $('#wtUnit').value);
  $('#waistInputs').innerHTML = lengthInputs('waist', $('#waistUnit').value === 'in' ? 'in' : 'cm', 'Waist');
  if (keep.ht > 0) prefillLen('ht', $('#htUnit').value, keep.ht);
  if (keep.wt > 0) prefillKg('wt', $('#wtUnit').value, keep.wt);
  if (keep.waist > 0) prefillLen('waist', $('#waistUnit').value === 'in' ? 'in' : 'cm', keep.waist);
  ['htUnit','wtUnit','waistUnit'].forEach(function(id){ $('#' + id).dataset.prev = $('#' + id).value; });
}
function prefillLen(id, unit, cm){
  if (unit === 'ftin') { var t = cm / IN_CM, ft = Math.floor(t / 12); $('#' + id + '_a').value = ft; $('#' + id + '_b').value = +(t - ft * 12).toFixed(1); return; }
  $('#' + id).value = +(unit === 'in' ? cm / IN_CM : cm).toFixed(1);
}
function prefillKg(id, unit, kg){
  if (unit === 'stlb') { var t = kg / LB_KG, st = Math.floor(t / 14); $('#' + id + '_a').value = st; $('#' + id + '_b').value = +(t - st * 14).toFixed(1); return; }
  $('#' + id).value = +(unit === 'lb' ? kg / LB_KG : kg).toFixed(1);
}
function setAll(metric){
  $('#allMetric').setAttribute('aria-pressed', metric ? 'true' : 'false'); $('#allImperial').setAttribute('aria-pressed', metric ? 'false' : 'true');
  $('#htUnit').value = metric ? 'cm' : 'ftin'; $('#wtUnit').value = metric ? 'kg' : 'stlb'; $('#waistUnit').value = metric ? 'cm' : 'in';
  renderMeasures(); changed();
}

/* any change clears the result, so an old result can never be saved (FR2-39 AS-14) */
function changed(){
  if (!LAST) return;
  LAST = null; window.LLD_RESULT = null;
  $('#results').hidden = true; ['bannerZone','headlineZone','rangeZone','waistZone','meaningZone','methodBody'].forEach(function(id){ $('#' + id).innerHTML = ''; });
  postHeight();
}

function showErr(key, text){ var el = $('#err-' + key); if (!el) return; el.textContent = text; el.hidden = !text; }

/* (4a) read and validate; returns { input } or { errors: [[key, text]] } */
function collect(){
  var E = MESSAGES.errors, errors = [], ageRaw = num('#age');
  var age = null;
  if (ageRaw === null || isNaN(ageRaw) || ageRaw < 1 || Math.floor(ageRaw) !== ageRaw) errors.push(['age', E.age]);
  else if (ageRaw > 99) errors.push(['age', E.ageRange]);
  else age = ageRaw;
  if (!S.preg) errors.push(['preg', E.preg]);
  if (!S.eat) errors.push(['eat', E.eat]);
  /* a stop needs no measurements: decide it as soon as its answers are valid */
  if (age !== null && S.preg && S.eat && (age < 18 || S.preg !== 'no' || S.eat === 'yes')) return { input: { age: age, preg: S.preg, eat: S.eat } };
  var ht = readLen('ht', $('#htUnit').value), wt = readKg('wt', $('#wtUnit').value), waist = readLen('waist', $('#waistUnit').value === 'in' ? 'in' : 'cm');
  if (!(ht >= 120 && ht <= 230)) errors.push(['ht', E.ht]);
  if (!(wt >= 25 && wt <= 300)) errors.push(['wt', E.wt]);
  if (waist !== null && !(waist >= 50 && waist <= 200)) errors.push(['waist', E.waist]);
  if (!S.bg) errors.push(['bg', E.bg]);
  if (S.bg === 'Mixed' && !S.mixed) errors.push(['mixed', E.mixed]);
  if (!S.loss) errors.push(['loss', E.loss]);
  if (errors.length) return { errors: errors };
  return { input: { age: age, preg: S.preg, eat: S.eat, heightCm: ht, weightKg: wt, waistCm: waist, bg: S.bg, mixed: S.bg === 'Mixed' ? S.mixed : null, loss: S.loss } };
}

/* ============================================================================
 * (4b) RENDER
 * ==========================================================================*/
function banner(cls, t, role){ return '<div class="banner ' + cls + '"' + (role ? ' role="' + role + '"' : '') + '><h3>' + esc(t.title) + '</h3><p>' + t.body + '</p></div>'; }
function pillClass(cat){ return cat === 'healthy' ? 'healthy' : (cat === 'overweight' || cat === 'underweight') ? 'caution' : 'high'; }
function fmtSt(lb){ return Math.floor(lb / 14) + ' st ' + (lb % 14) + ' lb'; }

function render(r, imperial){
  var M = MESSAGES, z = function(id){ return $('#' + id); };
  ['bannerZone','headlineZone','rangeZone','waistZone','meaningZone'].forEach(function(id){ z(id).innerHTML = ''; z(id).hidden = false; });
  if (r.stop) {
    z('bannerZone').innerHTML = banner('care', M.stops[r.stop], 'alert');
    ['headlineZone','rangeZone','waistZone','meaningZone'].forEach(function(id){ z(id).hidden = true; });
  } else {
    if (r.weightLoss) z('bannerZone').innerHTML = banner('alert', M.weightLoss, 'alert');
    z('headlineZone').innerHTML = '<p class="eyebrow">' + esc(M.headline.eyebrow) + '</p><p class="big" data-test="bmi">' + r.bmi.toFixed(1) +
      ' <span class="muted">' + M.headline.unit + '</span></p><span class="pill ' + pillClass(r.category) + '" data-test="category">' + esc(M.categories[r.category]) + '</span>' +
      '<p class="note muted" data-test="thresholds">' + esc(S.bg === 'NotSay' ? M.thresholds.notSay : (r.adjusted ? M.thresholds.adjusted : M.thresholds.standard)) + '</p>';
    var rg = r.range, txt = imperial ? fmtSt(rg.lowLb) + ' to ' + fmtSt(rg.highLb) : rg.lowKg.toFixed(1) + ' kg to ' + rg.highKg.toFixed(1) + ' kg';
    z('rangeZone').innerHTML = '<h2>' + esc(M.range.title) + '</h2><p class="big" style="font-size:1.6rem" data-test="range-value">' + txt + '</p><p class="note">' + esc(M.range.note) + '</p>';
    var w = r.waist, wz = '<h2>' + esc(M.waist.title) + '</h2>';
    if (!w) wz += '<p data-test="need-waist">' + esc(M.waist.needWaist) + '</p>';
    else if (w.band === 'notShown') wz += '<p data-test="waist-bmi35">' + esc(M.waist.bmi35) + '</p>';
    else if (w.band === 'below') wz += '<p class="big" style="font-size:1.6rem" data-test="whtr">' + w.ratio.toFixed(2) + '</p><p data-test="waist-below">' + esc(M.waist.below) + '</p>';
    else wz += '<p class="big" style="font-size:1.6rem" data-test="whtr">' + w.ratio.toFixed(2) + '</p><span class="pill ' + (w.band === 'healthy' ? 'healthy' : w.band === 'increased' ? 'caution' : 'high') + '" data-test="waist-band">' + esc(M.waist.bands[w.band]) + '</span><p class="note">' + esc(M.waist.meaning[w.band]) + '</p>';
    z('waistZone').innerHTML = wz;
    var key = r.category.indexOf('obese') === 0 ? 'obese' : r.category, mz = '<h2>' + esc(M.meaning.title) + '</h2><p data-test="meaning-text">' + esc(M.meaning[key]) + '</p>';
    r.notes.forEach(function(n){ mz += '<p class="note" data-test="note-' + n + '">' + (n === 'underweight' ? M.meaning.eatingSupport : esc(M.meaning[n])) + '</p>'; });
    z('meaningZone').innerHTML = mz;
  }
  /* a stop shows no numbers at all, so the method (which quotes thresholds) is shown with results only */
  z('methodBody').innerHTML = r.stop ? '' : M.method.paras.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
    '<p class="source" data-test="source-version">Source: NICE NG246 (2025) &middot; version <span data-lld-version data-lld-version-of="js:HW_ENGINE">healthy-weight</span></p>';
  $('#results details.method').hidden = !!r.stop;
  z('results').hidden = false;
}

/* (4c) the result offered to the landing page (lld-members-link.js reads window.LLD_RESULT); never the answers */
function publish(r){
  window.LLD_RESULT = r.stop ? { stop: true, onward: false }
    : { headline: r.bmi.toFixed(1), unit: 'kg/m²', band: MESSAGES.categories[r.category], onward: r.onward };
  document.dispatchEvent(new Event('lld-result-change'));
}

$('#tool').addEventListener('submit', function(e){
  e.preventDefault();
  ['age','preg','eat','ht','wt','waist','bg','mixed','loss'].forEach(function(k){ showErr(k, ''); });
  var sum = $('#errSummary'), got = collect();
  if (got.errors) {
    LAST = null; window.LLD_RESULT = null; $('#results').hidden = true; document.dispatchEvent(new Event('lld-result-change'));
    got.errors.forEach(function(x){ showErr(x[0], x[1]); });
    sum.innerHTML = '<p>' + esc(MESSAGES.errors.summary) + '</p><ul>' + got.errors.map(function(x){ return '<li><a href="#err-' + x[0] + '">' + esc(x[1]) + '</a></li>'; }).join('') + '</ul>';
    sum.hidden = false; sum.focus(); postHeight(); return;
  }
  sum.hidden = true;
  LAST = HW_ENGINE.assess(got.input);
  render(LAST, $('#wtUnit').value !== 'kg');
  publish(LAST);
  var res = $('#results'); if (res.focus) res.focus();
  postHeight();
});

$$('[data-tap]').forEach(function(group){
  var key = group.getAttribute('data-tap');
  group.addEventListener('click', function(e){
    var btn = e.target.closest('.tap'); if (!btn) return;
    $$('.tap', group).forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
    btn.setAttribute('aria-pressed', 'true');
    S[key] = btn.getAttribute('data-val');
    if (key === 'bg') { var mixed = S.bg === 'Mixed'; $('#mixedField').hidden = !mixed; if (!mixed) { S.mixed = null; $$('#mixedTaps .tap').forEach(function(b){ b.setAttribute('aria-pressed', 'false'); }); } }
    showErr(key, ''); changed(); postHeight();
  });
});
$('#tool').addEventListener('input', changed);
['htUnit','wtUnit','waistUnit'].forEach(function(id){ $('#' + id).addEventListener('change', function(){ renderMeasures(); changed(); }); });
$('#allMetric').onclick = function(){ setAll(true); };
$('#allImperial').onclick = function(){ setAll(false); };

/* iframe auto-resize: one message schema for every tool, posted only to the configured parent origin (FR1-21) */
function postHeight(){ var h = Math.ceil(document.documentElement.getBoundingClientRect().height); if (window.parent !== window) { try { parent.postMessage({ type: 'lld-tool-height', height: h }, '__LLD_ORIGIN__'); } catch (e) {} } }
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) { new ResizeObserver(postHeight).observe(document.body); }

fillCopy(); renderMeasures();

/* status gate (FR1-15 pattern): the form shows only when tools/status.json says this tool is active; fails closed */
(function(){
  var slug = 'healthy-weight', gate = $('#lldGate'), un = $('#lldUnavailable'), form = $('#tool');
  function show(el){ el.hidden = false; el.classList.remove('hidden'); } function hide(el){ el.hidden = true; el.classList.add('hidden'); if (el === gate) el.setAttribute('aria-busy', 'false'); }
  function unavailable(){ hide(gate); un.innerHTML = '<h2>' + esc(MESSAGES.unavailable.title) + '</h2><p>' + esc(MESSAGES.unavailable.body) + '</p><p><a href="__LLD_ORIGIN__/health-tools/" target="_top">See all health tools</a></p>'; show(un); hide(form); changed(); window.LLD_STATUS = 'withdrawn'; document.dispatchEvent(new Event('lld-result-change')); }
  function notice(){ gate.setAttribute('aria-busy', 'false'); gate.innerHTML = esc(MESSAGES.unavailable.unknown) + ' <button type="button" id="lldRetry" data-test="retry">Try again</button>'; $('#lldRetry').addEventListener('click', check); hide(form); window.LLD_STATUS = 'unknown'; }
  function check(){ gate.setAttribute('aria-busy', 'true'); gate.textContent = MESSAGES.unavailable.checking; show(gate); hide(un);
    if (typeof fetch !== 'function') { notice(); return; }
    fetch('./status.json', { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('status ' + r.status); return r.json(); }).then(function(s){
      var t = s && s.tools && s.tools[slug]; if (!t || t.status !== 'active') { unavailable(); return; }
      hide(gate); show(form); window.LLD_STATUS = 'active'; postHeight();
    }).catch(function(){ notice(); postHeight(); });
  }
  check();
})();
</script>
