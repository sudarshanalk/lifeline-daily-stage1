<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed harness — Lifeline Daily tool landing page</title>
<!-- Test double for the WordPress landing page (CMP-09): the exact embed contract the lld-tools shortcode renders
     (iframe with a real src on the configured origin, no lazy-load, parent listener with the per-environment origin).
     Served by tests/lib/htaccess-server.mjs at /__harness/landing.html?tool=protein|diabetes; __LLD_ORIGIN__ is substituted. -->
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:16px}iframe.lld-tool-frame{width:100%;border:0;display:block}</style>
<script>window.lld_tools_settings = { iframe_origin: '__LLD_ORIGIN__' };</script>
<script src="__LLD_ORIGIN__/wp-content/mu-plugins/lld-tools/assets/lld-tool-frame.js"></script>
</head>
<body>
<div class="wrap">
  <h1 data-test="landing-title">Tool landing page (harness)</h1>
  <div id="embed"></div>
  <p>Text after the embed proves the iframe height follows the content rather than a fixed value.</p>
</div>
<script>
  var tool = new URLSearchParams(location.search).get('tool') || 'protein';
  var file = tool === 'diabetes' ? 'diabetes-risk-tool.html' : 'protein-requirement-tool.html';
  var f = document.createElement('iframe');
  f.className = 'lld-tool-frame'; f.id = 'lld-tool-frame'; f.title = 'Lifeline Daily tool'; f.loading = 'eager';
  f.src = '__LLD_ORIGIN__/tools/' + file;
  document.getElementById('embed').appendChild(f);
  window.lldToolFrame.applyFallback();
</script>
</body>
</html>
