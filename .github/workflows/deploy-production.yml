name: deploy-production
on:
  push:
    tags: ['rc-*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only rehearsal
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/rc-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deployment safety tests and release preflight
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 -m unittest discover -s deploy/tests -v
          python3 deploy/preflight.py production
      - name: Clinical gate — HG-02 sign-off, copy deck and DEC ratification (NFR1-02, DEC-80)
        run: node tests/ci/clinical-gate.mjs
      - name: Require a successful automatic staging deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ['REPO']; sha=os.environ['SHA']
          def api(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          runs=api(f'repos/{repo}/actions/workflows/deploy-staging.yml/runs?status=success&event=push&head_sha={sha}&per_page=100')['workflow_runs']
          for run in runs:
              jobs=api(f"repos/{repo}/actions/runs/{run['id']}/jobs")['jobs']
              if any(j['name']=='deploy' and j['conclusion']=='success' for j in jobs):
                  print('Verified real staging deployment:',run['html_url']);break
          else: raise SystemExit('No successful automatic staging deployment for this exact commit')
          PY
  deploy:
    needs: validate
    if: vars.PROD_DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install transport tools
        run: sudo apt-get update && sudo apt-get install -y rsync php-cli
      - name: Configure dedicated LLD SSH identity
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/lld-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/lld-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/lld-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/lld-ssh/"*
      - name: Deploy managed overlay
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PROD_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_DOCROOT: ${{ secrets.PROD_DOCROOT }}
          DEPLOY_URL: https://lifelinedaily.com
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          export DEPLOY_KEY_FILE="$RUNNER_TEMP/lld-ssh/key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/lld-ssh/known_hosts"
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          bash deploy/deploy.sh production "${args[@]}"
      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/lld-ssh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deploy-log-production-${{ github.sha }}
          path: deploy/log/*.jsonl
          if-no-files-found: ignore
