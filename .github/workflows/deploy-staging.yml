name: deploy-staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only rehearsal
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deployment safety tests and release preflight
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 -m unittest discover -s deploy/tests -v
          python3 deploy/preflight.py staging
  deploy:
    needs: validate
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install transport tools
        run: sudo apt-get update && sudo apt-get install -y rsync php-cli
      - name: Configure dedicated LLD SSH identity
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/lld-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/lld-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/lld-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/lld-ssh/"*
      - name: Deploy managed overlay
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_DOCROOT: ${{ secrets.STAGING_DOCROOT }}
          DEPLOY_URL: https://stg.lifelinedaily.com
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          export DEPLOY_KEY_FILE="$RUNNER_TEMP/lld-ssh/key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/lld-ssh/known_hosts"
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          bash deploy/deploy.sh staging "${args[@]}"
      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/lld-ssh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deploy-log-staging-${{ github.sha }}
          path: deploy/log/*.jsonl
          if-no-files-found: ignore
