# Release-tag gates (docs/04 §1: `clinical-gate` and `release-gate` are tag checks, not PR checks).
# clinical-gate (NFR1-02, DEC-80): HG-02 artefacts approved — approvals/{protein,diabetes}.json clinical_signoff named, dated,
# `approved`; approvals/copy.json approved; no DEC row with ratify_at HG-02 left unratified. Red until HG-02 is held.
name: release-gates
on:
  push:
    tags: ['rc-*']
  workflow_dispatch:
jobs:
  clinical-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: HG-02 sign-off and DEC ratification (tests/ci/clinical-gate.mjs)
        run: node tests/ci/clinical-gate.mjs
